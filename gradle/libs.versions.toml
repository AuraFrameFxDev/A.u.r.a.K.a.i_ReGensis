androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose-icons" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
androidx-coordinatorlayout = { module = "androidx.coordinatorlayout:coordinatorlayout", version.ref = "androidx-coordinatorlayout" }

# RikkaX Ecosystem (Margin Controls & Settings)
rikkax-core-ktx = { module = "dev.rikka.rikkax:core-ktx", version.ref = "rikkax-core" }
rikkax-material = { module = "dev.rikka.rikkax:material", version.ref = "rikkax-material" }
rikkax-material-preference = { module = "dev.rikka.rikkax:material-preference", version.ref = "rikkax-material-preference" }
rikkax-insets = { module = "dev.rikka.rikkax.insets:insets", version.ref = "rikkax-insets" }
rikkax-layoutinflater = { module = "dev.rikka.rikkax.layoutinflater:layoutinflater", version.ref = "rikkax-layoutinflater" }
rikkax-appcompat = { module = "dev.rikka.rikkax.appcompat:appcompat", version.ref = "rikkax-appcompat" }

# System Root & Hooks
libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
libsu-service = { module = "com.github.topjohnwu.libsu:service", version.ref = "libsu" }
libsu-nio = { module = "com.github.topjohnwu.libsu:nio", version.ref = "libsu" }
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku-api" }
