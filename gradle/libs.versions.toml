[bundles]
androidx-core = ["androidx-core-ktx", "androidx-appcompat", "androidx-material"]
compose-ui = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-animation",
    "compose-foundation",
    "compose-foundation-layout",
    "compose-material3",
    "compose-material-icons-extended"
]
compose-tooling = ["compose-ui-tooling", "compose-ui-tooling-preview"]
room = ["androidx-room-runtime", "androidx-room-ktx"]
networking-retrofit = [
    "retrofit",
    "okhttp",
    "okhttp-logging-interceptor",
    "retrofit-converter-gson",
    "retrofit-converter-scalars"
]
networking-ktor = [
    "ktor-client-core",
    "ktor-client-okhttp",
    "ktor-client-content-negotiation",
    "ktor-serialization-kotlinx-json",
    "ktor-client-logging"
]
kotlinx = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android",
    "kotlinx-serialization-json",
    "kotlinx-datetime"
]
datastore = ["androidx-datastore-core", "androidx-datastore-preferences"]
firebase = [
    "firebase-analytics",
    "firebase-crashlytics",
    "firebase-auth",
    "firebase-firestore",
    "firebase-storage",
    "firebase-config",
    "firebase-messaging"
]
utilities = ["timber", "coil-compose", "coil-network-okhttp", "lottie-compose"]
testing = ["junit", "androidx-junit", "mockk", "robolectric", "turbine"]
langchain4j = [
    "langchain4j-core",
    "langchain4j-ollama",
    "langchain4j-open-ai",
    "langchain4j-google-ai-gemini",
    "langchain4j-vertex-ai-gemini"
]

