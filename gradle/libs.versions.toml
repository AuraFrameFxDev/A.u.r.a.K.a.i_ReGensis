androidx-credentials = { module = "androidx.credentials:credentials", version = "1.6.0" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version = "1.6.0" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version = "1.2.0" }
billing-ktx = { module = "com.android.billingclient:billing-ktx", version = "8.3.0" }
langchain4j-ollama = { module = "dev.langchain4j:langchain4j-ollama", version.ref = "langchain4j" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }

# AI & Media
langchain4j-core = { module = "dev.langchain4j:langchain4j-core", version.ref = "langchain4j" }
executorch-android = { module = "org.pytorch:executorch-android", version.ref = "executorch" }
firebase-sql-connect = { module = "com.google.firebase:firebase-dataconnect", version.ref = "firebase-sql-connect" }
firebase-vertexai = { module = "com.google.firebase:firebase-ai", version.ref = "firebase-vertexai" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-common = { module = "com.google.firebase:firebase-common" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
firebase-storage = { module = "com.google.firebase:firebase-storage" }
firebase-config = { module = "com.google.firebase:firebase-config" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
