[bundles]
androidx-core = ["androidx-core-ktx", "androidx-appcompat", "androidx-recyclerview", "androidx-coordinatorlayout", "material"]
room = ["androidx-room-runtime", "androidx-room-ktx"]
datastore = ["androidx-datastore-core", "androidx-datastore-preferences"]
compose-ui = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-animation",
    "compose-foundation",
    "compose-foundation-layout",
    "compose-material3",
    "compose-material-icons-extended"
]
compose-tooling = ["compose-ui-tooling", "compose-ui-tooling-preview"]
networking-retrofit = [
    "retrofit",
    "okhttp",
    "okhttp-logging-interceptor",
    "retrofit-converter-gson",
    "retrofit-converter-scalars",
    "retrofit-converter-kotlinx-serialization"
]
networking-ktor = [
    "ktor-client-core",
    "ktor-client-okhttp",
    "ktor-client-content-negotiation",
    "ktor-client-logging",
    "ktor-serialization-kotlinx-json"
]
bundle-kotlinx = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android",
    "kotlinx-serialization-json"
]
ai-core = [
    "langchain4j-core",
    "langchain4j-ollama",
    "langchain4j-google-ai-gemini",
    "langchain4j-open-ai",
    "langchain4j-vertex-ai-gemini",
    "google-genai"
]
root-utils = ["shizuku-api", "libsu-core", "libsu-nio", "libsu-service", "yukihookapi-api", "kavaref-core"]
utilities = ["timber", "coil-compose", "coil-network-okhttp", "lottie-compose", "moshi"]
firebase = ["firebase-analytics", "firebase-crashlytics", "firebase-auth", "firebase-firestore", "firebase-messaging", "firebase-storage", "firebase-config"]

