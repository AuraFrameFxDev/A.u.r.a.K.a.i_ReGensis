[versions]
# Core Build Tools
agp = "9.3.0-alpha03"
kotlin = "2.4.0-Beta2"
ksp = "2.3.7"
gradle = "9.5.0"

# SDK Versions
compile-sdk = "37"
target-sdk = "37"
min-sdk = "34"

# AndroidX Core & Lifecycle
androidx-core = "1.18.0"
androidx-appcompat = "1.7.1"
androidx-lifecycle = "2.10.0"
androidx-navigation = "2.9.8"
androidx-room = "2.8.4"
androidx-datastore = "1.3.0-alpha09" # Support for Tink/AEAD encryption
androidx-work = "2.11.2"

# Compose (BOM 2026.04.01)
compose-bom = "2026.04.01"
compose-material3 = "1.4.0"
compose-material3-adaptive = "1.3.0-beta01"
compose-ui = "1.11.1"

# Hilt DI
hilt = "2.59.2"
hilt-ext = "1.4.0-beta01"

# Firebase & AI
firebase-bom = "34.12.0"
firebase-sql-connect = "17.2.1"
firebase-ai-logic = "17.11.0"
langchain4j = "1.14.0"
executorch = "1.2.0"

# System & Modding (The "Rikka" Stack)
shizuku-api = "13.6.0" # API implementation version
shizuku-manager = "14.3.0" # Manager app version
rikkax-core = "1.4.1"
rikkax-material = "2.7.2"
rikkax-material-preference = "2.0.0"
rikkax-insets = "1.3.0" # Margin/Padding Control
rikkax-layoutinflater = "1.3.0" # Custom attribute support
rikkax-appcompat = "1.6.1"
libsu = "6.0.0"
yukihook = "1.3.1" # Stable version with HiddenApiBypass support
kavaref = "1.0.2"
hiddenapibypass = "6.1"

# Networking & Utils
retrofit = "3.0.0"
okhttp = "5.3.2"
ktor = "3.4.3"
coil = "3.4.0"
timber = "5.0.1"

# Testing
junit = "6.0.3"
mockk = "1.14.9"
robolectric = "4.16.1"
turbine = "1.2.1"

[libraries]
# AndroidX & Hilt
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidx-room" }
androidx-datastore-tink = { module = "androidx.datastore:datastore-tink", version.ref = "androidx-datastore" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hilt-ext" }

# RikkaX Ecosystem (Margin Controls & Settings)
rikkax-core-ktx = { module = "dev.rikka.rikkax:core-ktx", version.ref = "rikkax-core" }
rikkax-material = { module = "dev.rikka.rikkax:material", version.ref = "rikkax-material" }
rikkax-material-preference = { module = "dev.rikka.rikkax:material-preference", version.ref = "rikkax-material-preference" }
rikkax-insets = { module = "dev.rikka.rikkax.insets:insets", version.ref = "rikkax-insets" }
rikkax-layoutinflater = { module = "dev.rikka.rikkax.layoutinflater:layoutinflater", version.ref = "rikkax-layoutinflater" }
rikkax-appcompat = { module = "dev.rikka.rikkax.appcompat:appcompat", version.ref = "rikkax-appcompat" }

# System Root & Hooks
libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
libsu-service = { module = "com.github.topjohnwu.libsu:service", version.ref = "libsu" }
libsu-nio = { module = "com.github.topjohnwu.libsu:nio", version.ref = "libsu" }
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku-api" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku-api" }
yukihookapi-api = { module = "com.highcapable.yukihookapi:api", version.ref = "yukihook" }
kavaref = { module = "com.highcapable.kavaref:kavaref-core", version.ref = "kavaref" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }

# AI & Media
langchain4j-core = { module = "dev.langchain4j:langchain4j-core", version.ref = "langchain4j" }
executorch-android = { module = "org.pytorch:executorch-android", version.ref = "executorch" }
firebase-sql-connect = { module = "com.google.firebase:firebase-dataconnect", version.ref = "firebase-sql-connect" }
firebase-ai-logic = { module = "com.google.firebase:firebase-ai", version.ref = "firebase-ai-logic" }

# Testing
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[bundles]
rikkax-settings = [
    "rikkax-material",
    "rikkax-material-preference",
    "rikkax-insets",
    "rikkax-layoutinflater",
    "rikkax-appcompat"
]
root-stack = [
    "libsu-core",
    "libsu-service",
    "libsu-nio",
    "shizuku-api",
    "yukihookapi-api",
    "kavaref"
]
firebase-ai = [
    "firebase-sql-connect",
    "firebase-ai-logic"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
