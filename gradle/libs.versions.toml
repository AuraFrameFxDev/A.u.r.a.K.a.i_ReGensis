androidx-compose-remote-creation-compose = { group = "androidx.compose.remote", name = "remote-creation-compose", version.ref = "remote-creation-compose" }

[bundles]
ai-core = [
    "langchain4j-core",
    "executorch-android",
    "firebase-messaging",
    "firebase-vertexai",
    "firebase-sql-connect"
]
androidx-core = ["androidx-core-ktx", "androidx-appcompat", "androidx-lifecycle-runtime-compose", "google-material", "androidx-recyclerview", "androidx-coordinatorlayout"]
compose-ui = ["androidx-ui", "androidx-ui-graphics", "androidx-ui-tooling-preview", "androidx-lifecycle-runtime-compose", "androidx-material3", "compose-material-icons-extended"]
compose-tooling = ["androidx-ui-tooling", "androidx-ui-tooling-preview"]
utilities = ["timber", "coil-svg", "coil-compose"]
networking-retrofit = [
    "retrofit",
    "retrofit-converter-gson",
    "retrofit-converter-moshi",
    "retrofit-converter-scalars",
    "retrofit-converter-kotlinx-serialization",
    "okhttp",
    "okhttp-logging-interceptor"
]
networking-ktor = ["ktor-client-core", "ktor-client-okhttp", "ktor-client-serialization", "ktor-client-logging", "ktor-client-content-negotiation", "ktor-serialization-kotlinx-json"]
bundle-kotlinx = ["kotlinx-serialization-json"]
room = ["androidx-room-runtime", "androidx-room-ktx"]
datastore = ["androidx-datastore-tink", "androidx-datastore-preferences"]
firebase = [
    "firebase-sql-connect",
    "firebase-vertexai",
    "firebase-auth",
    "firebase-firestore",
    "firebase-storage",
    "firebase-config",
    "firebase-analytics",
    "firebase-crashlytics",
    "firebase-messaging",
    "firebase-common"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
