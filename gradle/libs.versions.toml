[versions]
# Core Build Tools
agp = "9.3.0-alpha01"
kotlin = "2.4.0-Beta2"
ksp = "2.3.7"
gradle = "9.5.0"

# SDK Versions
compile-sdk = "37"
target-sdk = "37"
min-sdk = "34"

# AndroidX Core & Lifecycle
androidx-core = "1.18.0"
androidx-appcompat = "1.7.1"
androidx-lifecycle = "2.10.0"
androidx-activity = "1.13.0"
androidx-navigation = "2.9.8"
androidx-room = "2.8.4"
androidx-datastore = "1.3.0-alpha09" # Support for Tink/AEAD encryption
androidx-work = "2.11.2"
androidx-recyclerview = "1.4.0"
androidx-coordinatorlayout = "1.3.0"

# Compose (BOM 2026.04.01)
compose-bom = "2026.05.00"
compose-material3 = "1.4.0"
compose-material3-adaptive = "1.3.0-beta01"
compose-icons = "1.7.8"
compose-ui = "1.11.1"

# Material Design
material = "1.13.0"

# Hilt DI
hilt = "2.59.2"
hilt-ext = "1.4.0-beta01"

# Firebase & AI
firebase-bom = "34.12.0"
firebase-sql-connect = "17.2.1"
firebase-vertexai = "17.11.0"
langchain4j = "1.14.0"
executorch = "1.2.0"

# System & Modding (The "Rikka" Stack)
shizuku-api = "13.1.5" # API implementation version
shizuku-manager = "14.3.0" # Manager app version
rikkax-core = "1.4.1"
rikkax-material = "2.7.2"
rikkax-material-preference = "2.0.0"
rikkax-insets = "1.3.0" # Margin/Padding Control
rikkax-layoutinflater = "1.3.0" # Custom attribute support
rikkax-appcompat = "1.6.1"
libsu = "6.0.0"
yukihook = "1.3.1" # Stable version with HiddenApiBypass support
kavaref = "1.0.2"
hiddenapibypass = "6.1"
media3 = "1.10.0"

# Networking & Utils
retrofit = "3.0.0"
okhttp = "5.3.2"
ktor = "3.4.3"
coil = "3.4.0"
timber = "5.0.1"
bouncycastle = "1.84"

# Testing
junit = "6.0.3"
mockk = "1.14.9"
robolectric = "4.16.1"
turbine = "1.2.1"
google-services = "4.4.4"
firebase-crashlytics = "3.0.7"
desugar-jdk-libs = "2.1.5"
remote-creation-compose = "1.0.0-alpha010"

[libraries]
# Build Logic Dependencies
gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# AndroidX & Hilt
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
