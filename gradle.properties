# JDK & JVM
# Explicitly use Java 25.0.2 for Gradle builds (Windows path)
# Enable Gradle's automatic Java toolchain detection as fallback
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
# Optimized for 16GB RAM system (Ryzen 7 5700X)
# Enable headless mode to prevent IntelliJ IDEA APIs from initializing in CI
# Idea force core classloader fix for KSP (KT-73255)
org.gradle.jvmargs=-Xmx10g -Dfile.encoding=UTF-8 -Djava.awt.headless=true -Dkotlin.daemon.jvm.options=-Didea.force.use.core.classloader=true

# AGP 9.0 / Hilt Compatibility Bridge
# Enabled built-in Kotlin as per AGP 9.0 documentation
android.builtInKotlin=true
kotlin.builtInKotlin=true
android.disableLastStageWhenHiltIsApplied=true
# Resolve BaseExtension cast errors in AGP 9.3+ by staying on legacy DSL for Hilt
# Performance & Modern Defaults
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2

# KSP / Kotlin 2.3 Alignment
# KSP1 is no longer available in this toolchain. KSP2 is mandatory.
ksp.incremental=false
ksp.kotlinApiVersion=2.3
ksp.kotlinLanguageVersion=2.3
# Workaround for FIR Internal Error (KT-73255 / Phase mismatch)
# Do not explicitly set ksp.useKSP2 to false.

aurafx.skip.tests=true
android.enableUnitTest=false
android.enableAndroidTest=false

# ???????????????????????????????????????????????????????????????????????????
# Android Gradle Plugin Settings
# ???????????????????????????????????????????????????????????????????????????
android.useAndroidX=true
android.enableJetifier=false

# NDK
android.ndkVersion=29.0.14206865
org.gradle.configuration-cache=true

